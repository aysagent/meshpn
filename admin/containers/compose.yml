services:
  admin:
    build:
      context: ../..
      dockerfile: admin/containers/Containerfile
    restart: unless-stopped
    # The container binds only 127.0.0.1:8080/18443. Host systemd sockets
    # bind 192.168.7.1 ports 80/8443 to usb0 and proxy into these listeners.
    # No public port publishing and no device/firewall capability in container.
    network_mode: host
    user: "${MPN_ADMIN_UID:?Set UID of meshpn-admin}:${MPN_ADMIN_GID:?Set GID of meshpn-admin}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 192m
    volumes:
      - /etc/meshpn-admin/web-container.json:/config/web.json:ro
      - /var/lib/meshpn-admin-web:/var/lib/meshpn-admin-web:rw
      - /run/meshpn-admin:/run/meshpn-admin:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
