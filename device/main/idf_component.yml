dependencies:
  esphome/wireguard: "0.4.6"
  espressif/esp_hosted:
    version: "1.4.*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_tinyusb: "1.7.6~2"
  # Telemetry generators deliberately validate this exact driver source.
  espressif/tinyusb: "0.21.0~1"
  espressif/esp_wifi_remote:
    version: "0.14.*"
    rules:
      - if: "target == esp32p4"
  espressif/iot_bridge:
    version: "1.1.0"
    rules:
      - if: "target == esp32s3"
  espressif/mdns: "1.5.3"
  idf:
    version: ">=5.4.1,<5.5"
