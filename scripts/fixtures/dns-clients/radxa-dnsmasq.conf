# Observed USB gadget baseline, NOT a deployment template.
# Duplicate DHCP option 6 is intentional regression evidence.
interface=usb0
listen-address=127.0.0.1,192.168.7.1
dhcp-range=192.168.7.10,192.168.7.50,255.255.255.0,12h
dhcp-option=3,192.168.7.1
dhcp-option=6,192.168.7.1
dhcp-option=option:dns-server,1.1.1.1
#server=127.0.0.1#53
server=1.1.1.1
server=8.8.8.8
no-resolv
